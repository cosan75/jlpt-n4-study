<style>
:root { --bg: #f5f6f8; --paper: #fff; --ink: #1b2233; --muted: #5f6b80; --line: #dde1e8; --indigo: #23407a; --bad: #b8392b; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #11151d; --paper: #1a202b; --ink: #e8ebf1; --muted: #9aa5b8; --line: #2c3442; --indigo: #9db5ea; --bad: #f08a7c; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; display: grid; place-items: center;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
form { width: min(360px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 22px; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input[type=password] { font: inherit; font-size: 18px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
label.rem { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
button { font: inherit; font-size: 16px; font-weight: 700; border: 0; border-radius: 8px; padding: 11px; background: var(--indigo); color: var(--paper); cursor: pointer; }
button[disabled] { opacity: .6; }
#msg { min-height: 1.4em; color: var(--bad); font-size: 14px; }
[hidden] { display: none !important; }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const store = { get() { try { return JSON.parse(localStorage.getItem('n4key') || 'null'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('n4key', JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem('n4key'); } catch (e) {} } };

async function openWith(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.d));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function fromPassword(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
function showForm() { document.getElementById('f').hidden = false; document.getElementById('pw').focus(); }

(async () => {
  const saved = store.get();
  if (saved && saved.s === P.s) {
    try { return await openWith(await crypto.subtle.importKey('raw', b64(saved.k), 'AES-GCM', true, ['decrypt'])); }
    catch (e) { store.clear(); }
  }
  showForm();
})();

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = '여는 중…'; msg.textContent = '';
  try {
    const remember = document.getElementById('rem').checked;
    const key = await fromPassword(document.getElementById('pw').value);
    const raw = await crypto.subtle.exportKey('raw', key);
    // 풀리는지 먼저 확인한 뒤 기억하고 연다 (열면 이 페이지가 앱으로 바뀐다)
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.d));
    if (remember) store.set({ s: P.s, k: toB64(raw) });
    await openWith(key);
  } catch (err) {
    btn.disabled = false; btn.textContent = '열기';
    msg.textContent = '비밀번호가 맞지 않아요.';
    document.getElementById('pw').select();
  }
});
</script>
